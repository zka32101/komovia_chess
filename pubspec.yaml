name: komovia_chess
description: "Komovia Chess - Learn chess with AI-powered tactics puzzles and multiplayer online matches."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  komovia_core:
    git:
      url: https://github.com/zka32101/komovia_core
      ref: main

  # State Management
  riverpod: ^2.2.0
  flutter_riverpod: ^2.2.0

  # Firebase
  firebase_core: ^2.13.0
  firebase_auth: ^4.4.0
  cloud_firestore: ^4.4.0
  firebase_database: ^10.0.0
  firebase_storage: ^11.0.0
  firebase_analytics: ^10.0.0
  firebase_crashlytics: ^3.0.0
  cloud_functions: ^4.3.0

  # UI/UX
  lottie: ^2.0.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.0.0

  # Audio
  just_audio: ^0.9.36

  # Chess Engine
  chess: ^0.7.0
  stockfish: ^1.7.0

  # Local Storage
  sqflite: ^2.2.0
  path: ^1.8.0
  path_provider: ^2.0.0

  # Authentication UI
  firebase_ui_auth: ^1.5.0
  google_sign_in: ^6.0.0
  sign_in_with_apple: ^8.2.0

  # Payment (in-app purchases)
  in_app_purchase: ^3.1.0

  # Charts
  fl_chart: ^0.66.0

  # Device / connectivity info
  connectivity_plus: ^4.0.2
  device_info_plus: ^9.1.0
  package_info_plus: ^4.2.0

  # Utilities
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  intl: ^0.20.3
  logger: ^2.0.0
  dio: ^5.2.0

  # Sharing (post-game GIF export)
  image: ^4.2.0
  share_plus: ^10.1.4

  # Cross-promotion (opening a sibling Komovia app's store listing)
  url_launcher: ^6.3.1
  firebase_remote_config: ^4.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  build_runner: ^2.16.1
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  flutter_launcher_icons: ^0.13.1
  fake_cloud_firestore: ^2.5.2

# `dart run flutter_launcher_icons` regenerates every Android
# mipmap-*/ic_launcher.png from assets/images/app_icon_master.png. As of
# 2026-10-31 this is generated for real with Flutter tooling (Flutter SDK
# is available in this sandbox again) from the Komovia-branded chess icon
# designed in Canva. No ios/ directory exists in this repo (the app is
# Android-only), so no iOS icon set is configured.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon_master.png

flutter:
  generate: true
  uses-material-design: true

  # Assets
  # .env is intentionally NOT listed here: it used to be bundled as a
  # Flutter asset (a plaintext file shipped unencrypted inside every
  # APK/IPA, extractable with a plain `unzip`) and read at runtime via
  # flutter_dotenv. Firebase/RevenueCat config now comes from
  # --dart-define-from-file=.env at build time instead - see
  # DefaultFirebaseOptions and RevenueCatConfig.
  assets:
    - assets/images/
    - assets/images/board_skins/
