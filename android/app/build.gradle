plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Release signing config, loaded from android/key.properties (gitignored; never commit
// the keystore or its passwords). See android/key.properties.example for the expected
// shape. Falls back to debug signing with a warning when the file is absent, so a plain
// `flutter run --release`/local build still works without the real release key.
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
def hasReleaseSigningConfig = keystorePropertiesFile.exists()
if (hasReleaseSigningConfig) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.warn("android/key.properties not found - release builds will be signed with the debug key, not suitable for a store upload. See android/key.properties.example.")
}

android {
    namespace = "com.yourwish.komovia_chess"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.yourwish.komovia_chess"
        // Android 7.0 (API 24), matching DeploymentConfig.minAndroidApiLevel and
        // the "Android 7+" target platform documented in CLAUDE.md.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigningConfig) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigningConfig ? signingConfigs.release : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
